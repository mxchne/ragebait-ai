<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ragebait.ai</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
    }
    .header {
      padding: 20px 24px;
      border-bottom: 1px solid #1a1a1a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-size: 22px; font-weight: 800; }
    .logo span { color: #ff4444; }
    .credits {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 13px;
      color: #aaa;
    }
    .credits span { color: #ff4444; font-weight: 700; }
    .main { max-width: 680px; margin: 0 auto; padding: 48px 24px; }
    h1 { font-size: 42px; font-weight: 900; text-align: center; margin-bottom: 8px; }
    h1 span { color: #ff4444; }
    .subtitle { text-align: center; color: #666; margin-bottom: 40px; font-size: 16px; }
    .input-area {
      background: #111;
      border: 1px solid #222;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }
    textarea {
      width: 100%;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 15px;
      resize: none;
      min-height: 100px;
      font-family: inherit;
    }
    textarea::placeholder { color: #444; }
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #222;
    }
    .intensity { display: flex; gap: 8px; }
    .intensity button {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #888;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
    }
    .intensity button.active {
      background: #ff4444;
      border-color: #ff4444;
      color: #fff;
    }
    .generate-btn {
      background: #ff4444;
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      margin-top: 16px;
    }
    .generate-btn:hover { background: #ff2222; transform: translateY(-1px); }
    .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .results { margin-top: 28px; display: flex; flex-direction: column; gap: 12px; }
    .result-card {
      background: #111;
      border: 1px solid #222;
      border-radius: 14px;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .result-text { font-size: 15px; line-height: 1.5; flex: 1; }
    .copy-btn {
      background: #1a1a1a;
      border: 1px solid #333;
      color: #888;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .copy-btn:hover { border-color: #ff4444; color: #ff4444; }
    .upgrade-banner {
      background: linear-gradient(135deg, #1a0a0a, #1a1a1a);
      border: 1px solid #ff4444;
      border-radius: 16px;
      padding: 20px;
      margin-top: 32px;
      text-align: center;
    }
    .upgrade-banner h3 { color: #ff4444; margin-bottom: 6px; }
    .upgrade-banner p { color: #888; font-size: 14px; margin-bottom: 14px; }
    .upgrade-btn {
      background: #ff4444;
      color: #fff;
      border: none;
      padding: 10px 24px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
    }
    .loading { text-align: center; color: #666; padding: 20px; }
    .error { color: #ff4444; text-align: center; padding: 12px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">rage<span>bait</span>.ai</div>
    <div class="credits">Credits: <span id="creditCount">20</span> left</div>
  </div>

  <div class="main">
    <h1>Make them <span>lose it</span> 🔥</h1>
    <p class="subtitle">Paste a message or situation. Get savage responses.</p>

    <div class="input-area">
      <textarea id="inputText" placeholder="e.g. My coworker took credit for my idea in front of the whole team..." rows="4"></textarea>
      <div class="controls">
        <div class="intensity">
          <button class="active" onclick="setIntensity('mild', this)">😤 Mild</button>
          <button onclick="setIntensity('spicy', this)">🌶️ Spicy</button>
          <button onclick="setIntensity('nuclear', this)">☢️ Nuclear</button>
        </div>
      </div>
    </div>

    <button class="generate-btn" onclick="generate()" id="genBtn">
      Generate Ragebait 🔥
    </button>

    <div id="results" class="results"></div>

    <div class="upgrade-banner">
      <h3>🚀 Go Unlimited</h3>
      <p>$9.99/mo for unlimited generations. No more running out mid-drama.</p>
      <button class="upgrade-btn">Upgrade Now</button>
    </div>
  </div>

  <script>
    let intensity = 'mild';
    let credits = 20;

    function setIntensity(level, btn) {
      intensity = level;
      document.querySelectorAll('.intensity button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    async function generate() {
      const text = document.getElementById('inputText').value.trim();
      if (!text) return alert('Paste something first!');
      if (credits <= 0) return alert('Out of credits! Upgrade to keep going.');

      credits -= 10;
      document.getElementById('creditCount').textContent = credits;

      const btn = document.getElementById('genBtn');
      btn.disabled = true;
      btn.textContent = 'Generating...';

      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '<div class="loading">Cooking up some chaos... 🔥</div>';

      try {
       const response = await fetch('/api/generate', {
  method: 'POST',
  headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ situation: text, intensity })
});

const data = await response.json();
const responses = data.responses;


        resultsDiv.innerHTML = responses.map(r => `
          <div class="result-card">
            <div class="result-text">${r}</div>
            <button class="copy-btn" onclick="copyText('${r.replace(/'/g, "\\'")}', this)">Copy</button>
          </div>
        `).join('');
      } catch (e) {
        resultsDiv.innerHTML = '<div class="error">Something went wrong. Try again!</div>';
      }

      btn.disabled = false;
      btn.textContent = 'Generate Ragebait 🔥';
    }

    function copyText(text, btn) {
      navigator.clipboard.writeText(text);
      btn.textContent = 'Copied!';
      setTimeout(() => btn.textContent = 'Copy', 2000);
    }
  </script>
</body>
</html>
